name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: No third-party imports in core
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          allowed = set(sys.stdlib_module_names) | {"kepil"}
          bad = []
          for f in pathlib.Path("src").rglob("*.py"):
              tree = ast.parse(f.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          if a.name.split(".")[0] not in allowed:
                              bad.append((str(f), a.name))
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      if node.module.split(".")[0] not in allowed:
                          bad.append((str(f), node.module))
          if bad:
              print("Внешние зависимости в ядре:", bad)
              raise SystemExit(1)
          print("OK: ядро без внешних зависимостей")
          PY
